<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Linguistic Wordle</title>

    <style>

        .green {
            background-color: green;
        }

        .yellow {
            background-color: yellow;
        }

        .grey {
            background-color: grey;
        }
        .keyboard{
            position: absolute;
            top:60%;    
            left:35%;
        }
        .row {
            display: flex;
            gap: 5px;
            margin-bottom: 5px;
        }

        .tile {
            width: 40px;
            height: 40px;
            border: 2px solid black;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            font-weight: bold;
        }   
        #board{
            position: absolute;
            top:20%;    
            left:35%;
        }
    </style>
</head>

<body>
    <div class="keyboard">

 

        <div class="row">

            <button class="key">Q</button>

            <button class="key">W</button>

            <button class="key">E</button>

            <button class="key">R</button>

            <button class="key">T</button>

            <button class="key">Y</button>

            <button class="key">U</button>

            <button class="key">I</button>

            <button class="key">O</button>

            <button class="key">P</button>

        </div>
        
        <div class="row">

            <button class="key">A</button>
            
            <button class="key">S</button>
            
            <button class="key">D</button>
            
            <button class="key">F</button>
            
            <button class="key">G</button>
            
            <button class="key">H</button>
            
            <button class="key">J</button>
            
            <button class="key">K</button>
            
            <button class="key">L</button>
            
        </div>
            
            
        <div class="row">
            
            <button class="key">Z</button>
            
            <button class="key">X</button>
            
            <button class="key">C</button>
            
            <button class="key">V</button>
            
            <button class="key">B</button>
            
            <button class="key">N</button>
            
            <button class="key">M</button>
            
        </div>
    </div>
    <div id="board"></div>
    <script>
        const tries = 6;
        const word_to_guess = "{{solution}}";
        const word_length = {{length_of_word}};  

        const board = document.getElementById("board");

        for (let r = 0; r < tries; r++) {

            const row = document.createElement("div");
            row.classList.add("row");

            for (let c = 0; c < word_length; c++) {

                const tile = document.createElement("div");

                tile.classList.add("tile");
                tile.id = `r${r}c${c}`;

                row.appendChild(tile);
            }

            board.appendChild(row);
        }
        
        let current_column = 0;
        let current_line = 0;
        let current_word = "";

        document.addEventListener("keydown", function(event) {
        
        if (/^[a-zA-Z]$/.test(event.key)) {
        
            if (current_column < word_length) {
        
                const tile = document.getElementById(
                `r${current_line}c${current_column}`
                );
                
                tile.textContent = event.key.toUpperCase();
                
                current_word += event.key.toLowerCase();
                current_column++;
            }
        }
        

        if (event.key === "Backspace") {

            if (current_column > 0) {

                current_column--;
                current_word = current_word.slice(0, -1);
                const tile = document.getElementById(
                    `r${current_line}c${current_column}`
                );

                tile.textContent = "";
            }
        }

        if (event.key === "Enter") {
            if (current_column === word_length) {
                const rowToColor = current_line;
                fetch("/guess", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        "current_word": current_word
                    })
                })
                .then(response => response.json())
                .then(data => {
                    console.log(data);
                    data.colors.forEach((color, index) => {
                    const tile = document.getElementById(
                        `r${rowToColor}c${index}`
                    );
                        tile.classList.add(color);
                    });
                });
                current_word = ""
                current_line++;
                current_column = 0;
            }
        }
    });
        
    </script>
   

</body>
</html>
