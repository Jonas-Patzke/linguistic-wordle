<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Linguistic Wordle</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            text-align: center;
        }

        h1 {
            font-size: 6rem;
            font-weight: bold;
            color: black;
            margin-bottom: 25px;
        }

        p {
            font-size: 1.8rem;
            color: black;
            margin-bottom: 40px;
        }

        .button-container {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .button {
            display: inline-block;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            text-decoration: none;
            color: white;
            border-radius: 10px;
            transition: all 0.2s ease;
        }

        .button:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .beginner {
            background-color: #6aaa64;
        }

        .beginner:hover {
            background-color: #5b9a54;
        }

        .expert {
            background-color: #787c7e;
        }

        .expert:hover {
            background-color: #666a6c;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>LINGUISTIC WORDLE</h1>

        <p>Choose your game mode:</p>

        <div class="button-container">

            <a href="beginner_mode.html">
                Beginner
            </a>

            <a href="expert_mode.html">
                Expert
            </a>

        </div>
    </div>

</body>
</html>
