<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>linguistic Wordle</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(135deg, #f5f7fa, #dfe9f3);
            font-family: Arial, sans-serif;
        }

        .container {
            text-align: center;
        }

        h1 {
            font-size: 5rem;
            margin-bottom: 20px;
            color: #222;
        }

        p {
            font-size: 1.6rem;
            margin-bottom: 30px;
            color: #555;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        input[type="submit"] {
            padding: 15px 35px;
            font-size: 1.2rem;
            font-weight: bold;

            border: none;
            border-radius: 12px;

            background: #4f46e5;
            color: white;

            cursor: pointer;

            transition: all 0.25s ease;
        }

        input[type="submit"]:hover {
            transform: translateY(-3px);
            background: #4338ca;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>LINGUISTIC WORDLE</h1>

        <p>Choose your game mode:</p>

        <div class="buttons">
            <input type="submit"
                   name="game_mode_with_lemma"
                   value="Beginner">

            <input type="submit"
                   name="game_mode_without_lemma"
                   value="Expert">
        </div>
    </div>
</body>
</html>
